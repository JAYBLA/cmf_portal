<div class="modal-header bg-danger text-white"><h5 class="modal-title">Delete Project</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
<form method="post" hx-post="{% url 'projects:project_delete' project.id %}" hx-swap="none">
  {% csrf_token %}
  <div class="modal-body"><p class="mb-0">Are you sure you want to delete <strong>{{ project.project_name }}</strong>?</p></div>
  <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-danger">Delete Project</button></div>
</form>
