<div class="modal-header bg-danger text-white"><h5 class="modal-title">Delete Expense</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
<form method="post" hx-post="{% url 'projects:expense_delete' expense.id %}" hx-swap="none">{% csrf_token %}<div class="modal-body"><p class="mb-0">Delete the expense <strong>{{ expense.description }}</strong>?</p></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-danger">Delete Expense</button></div></form>
