{% extends "base.html" %}

{% block content %}
<div class="col-12">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="card-title mb-0">Projects</h4>
      {% if request.user.can_manage_records %}
        <button class="btn btn-primary" hx-get="{% url 'projects:project_create' %}" hx-target="#modal-body" hx-swap="innerHTML">Add Project</button>
      {% endif %}
    </div>
    <div class="card-body p-1">
      <table id="responsiveTable" class="table table-sm table-hover align-middle" style="width:100%;">
        <thead class="table-light">
          <tr><th class="text-center" style="width:50px;">#</th><th>Project details</th><th class="text-end" style="width:140px;">Actions</th></tr>
        </thead>
        <tbody id="table-container" data-refresh-url="{% url 'projects:project_table' %}">
          {% include "projects/partials/project_table.html" %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
