{% extends "base.html" %}
{% block content %}
<div class="col-12">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div><h4 class="card-title mb-0">Lendings</h4><small class="text-muted">Track CMF company items issued to customers and their returns.</small></div>
      {% if request.user.can_manage_records %}<button class="btn btn-primary" hx-get="{% url 'lendings:lending_create' %}" hx-target="#modal-body" hx-swap="innerHTML">Add Lending</button>{% endif %}
    </div>
    <div class="card-body">
      <form class="border rounded bg-light p-3 mb-3"
            hx-get="{% url 'lendings:lending_table' %}" hx-target="#table-container" hx-swap="innerHTML"
            hx-trigger="submit, input changed delay:350ms, change" hx-sync="this:replace">
        <div class="row g-2 align-items-end">
          <div class="col-lg-3 col-md-6"><label class="form-label small mb-1">Customer</label><input type="search" name="customer" value="{{ request.GET.customer }}" class="form-control form-control-sm" placeholder="Customer or company"></div>
          <div class="col-lg-3 col-md-6"><label class="form-label small mb-1">Item</label><input type="search" name="item" value="{{ request.GET.item }}" class="form-control form-control-sm" placeholder="Item name or asset tag"></div>
          <div class="col-lg-2 col-md-4"><label class="form-label small mb-1">Status</label><select name="status" class="form-select form-select-sm"><option value="">All statuses</option>{% for value, label in status_choices %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
          <div class="col-lg-2 col-md-4"><label class="form-label small mb-1">Lent from</label><input type="text" name="date_from" value="{{ request.GET.date_from }}" class="form-control form-control-sm flatpickr" autocomplete="off" placeholder="Start date"></div>
          <div class="col-lg-2 col-md-4"><label class="form-label small mb-1">Lent to</label><input type="text" name="date_to" value="{{ request.GET.date_to }}" class="form-control form-control-sm flatpickr" autocomplete="off" placeholder="End date"></div>
          <div class="col-12 d-flex gap-2 justify-content-end"><button class="btn btn-primary btn-sm" type="submit">Filter</button><a class="btn btn-outline-secondary btn-sm" href="{% url 'lendings:lending_list' %}">Clear</a></div>
        </div>
      </form>
      <div id="table-container" data-refresh-url="{% url 'lendings:lending_table' %}{% if request.GET.urlencode %}?{{ request.GET.urlencode }}{% endif %}">{% include "lendings/partials/lending_results.html" %}</div>
    </div>
  </div>
</div>
{% endblock %}
