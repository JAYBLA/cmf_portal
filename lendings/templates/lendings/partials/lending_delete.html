<div class="modal-header bg-danger text-white"><h5 class="modal-title">Delete Lending</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
<form method="post" hx-post="{% url 'lendings:lending_delete' lending.id %}" hx-swap="none">{% csrf_token %}<div class="modal-body"><p>Delete <strong>{{ lending.lending_number }}</strong> for <strong>{{ lending.customer }}</strong> and all its items?</p></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-danger">Delete Lending</button></div></form>
