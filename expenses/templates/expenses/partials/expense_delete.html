<form method="post" hx-post="{% url 'expenses:expense_delete' expense.id %}" hx-swap="none">
  {% csrf_token %}
  <div class="modal-header">
    <h5 class="modal-title">Delete Expense</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body">
    <div class="alert alert-warning mb-0">
      Delete <strong>{{ expense.expense_number }}</strong> for <strong>{{ expense.description }}</strong>? This action cannot be undone.
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-danger">Delete Expense</button>
  </div>
</form>
